# Pubblica il gioco su GitHub Pages a ogni push su main.
# Viene richiamato anche da update-players.yml dopo l'aggiornamento dei giocatori.
name: Pubblica sito

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url || steps.deployment_4.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml css js icons _site/
          [ -f CNAME ] && cp CNAME _site/ || true

      # Versione dei file = commit pubblicato. Si usa HEAD e non GITHUB_SHA perché, quando il deploy parte
      # da update-players.yml, GITHUB_SHA è il commit prima dell'aggiornamento dei giocatori.
      - name: Aggiungi la versione ai file
        run: |
          V=$(git rev-parse --short HEAD)
          sed -i "s/?v=dev/?v=$V/g" _site/index.html
          sed -i "s/const VERSION = \"dev\"/const VERSION = \"$V\"/" _site/sw.js
          # se un segnaposto non viene sostituito il deploy si ferma, invece di pubblicare file con la cache sbagliata
          if grep -q "?v=dev" _site/index.html || ! grep -q "const VERSION = \"$V\"" _site/sw.js; then
            echo "::error::Versione non applicata a index.html o sw.js"; exit 1
          fi
          echo "Versione dei file: $V"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Bug di GitHub (actions/deploy-pages#451, novembre 2026): a volte la pubblicazione subito dopo il caricamento
      # non trova il pacchetto ("No artifacts named github-pages"). Si riprova solo la pubblicazione, dopo 5, 20 e 60 s:
      # rilanciare l'intera esecuzione ricaricherebbe il pacchetto e fallirebbe con "Multiple artifacts named github-pages".
      # Togliere i tentativi quando GitHub avrà corretto il bug.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 5
      - id: deployment_2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment_2.outcome == 'failure'
        run: sleep 20
      - id: deployment_3
        if: steps.deployment_2.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment_3.outcome == 'failure'
        run: sleep 60
      # ultimo tentativo senza continue-on-error: se fallisce anche questo, il deploy risulta fallito
      - id: deployment_4
        if: steps.deployment_3.outcome == 'failure'
        uses: actions/deploy-pages@v5
