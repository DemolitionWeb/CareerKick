# Pubblica il gioco su GitHub Pages a ogni push su main.
# Viene richiamato anche da update-players.yml dopo l'aggiornamento dei giocatori.
name: Pubblica sito

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icon.svg robots.txt sitemap.xml css js icons _site/
          [ -f CNAME ] && cp CNAME _site/ || true

      # Versione dei file = commit pubblicato. Si usa HEAD e non GITHUB_SHA perché, quando il deploy parte
      # da update-players.yml, GITHUB_SHA è il commit prima dell'aggiornamento dei giocatori.
      - name: Aggiungi la versione ai file
        run: |
          V=$(git rev-parse --short HEAD)
          sed -i "s/?v=dev/?v=$V/g" _site/index.html
          sed -i "s/const VERSION = \"dev\"/const VERSION = \"$V\"/" _site/sw.js
          # se un segnaposto non viene sostituito il deploy si ferma, invece di pubblicare file con la cache sbagliata
          if grep -q "?v=dev" _site/index.html || ! grep -q "const VERSION = \"$V\"" _site/sw.js; then
            echo "::error::Versione non applicata a index.html o sw.js"; exit 1
          fi
          echo "Versione dei file: $V"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
