# Pubblica il gioco su GitHub Pages a ogni push su main.
# Viene richiamato anche da update-players.yml dopo l'aggiornamento dei giocatori.
name: Pubblica sito

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icon.svg css js icons _site/
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
