# Aggiorna i giocatori da Wikidata dopo ogni sessione di calciomercato e ripubblica il sito.
# Le sessioni dei campionati chiudono tra fine agosto e la prima settimana di settembre, e a inizio febbraio: si aggiorna
# pochi giorni dopo e di nuovo due settimane dopo, perché Wikidata registra i trasferimenti con un po' di ritardo.
# Si può lanciare anche a mano da GitHub: Actions → Aggiorna giocatori → Run workflow.
name: Aggiorna giocatori

on:
  schedule:
    - cron: "0 5 4 9 *"   # 4 settembre
    - cron: "0 5 16 9 *"  # 16 settembre
    - cron: "0 5 5 2 *"   # 5 febbraio
    - cron: "0 5 17 2 *"  # 17 febbraio
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Salva il conteggio attuale
        run: node -e 'const s=require("fs").readFileSync("js/data.js","utf8");console.log((s.match(/"q":"Q/g)||[]).length)' > old_count.txt

      - name: Scarica i giocatori da Wikidata
        run: node scripts/build-players.mjs --min-sitelinks 25 --since 1995

      # se Wikidata risponde male e i giocatori calano di colpo, non si pubblica nulla
      - name: Controlla che il dataset sia sano
        run: |
          OLD=$(cat old_count.txt)
          NEW=$(node -e 'const s=require("fs").readFileSync("js/data.js","utf8");console.log((s.match(/"q":"Q/g)||[]).length)')
          echo "Giocatori: prima $OLD, ora $NEW"
          if [ "$NEW" -lt $(( OLD * 9 / 10 )) ]; then echo "::error::Troppi giocatori in meno ($OLD → $NEW): aggiornamento annullato"; exit 1; fi
          rm old_count.txt

      - name: Commit se ci sono novità
        id: commit
        run: |
          if git diff --quiet js/data.js; then
            echo "Nessun cambiamento"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git commit -m "Aggiornamento giocatori dopo il calciomercato ($(date +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # un push fatto da un workflow non fa partire gli altri workflow, quindi la pubblicazione si richiama qui
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
