# Aggiorna i giocatori da Wikidata due volte al giorno e ripubblica il sito se qualcosa è cambiato.
# Al mattino si prendono le modifiche fatte su Wikidata fino alla sera prima, alla sera quelle della giornata.
# Gli orari sono in UTC (GitHub non conosce l'ora legale): 5:00 UTC = 6:00 d'inverno e 7:00 d'estate in Italia,
# 20:00 UTC = 21:00 d'inverno e 22:00 d'estate. GitHub può far partire i workflow programmati con qualche minuto di ritardo.
# Si può lanciare anche a mano da GitHub: Actions → Aggiorna giocatori → Run workflow.
name: Aggiorna giocatori

on:
  schedule:
    - cron: "0 5 * * *"   # mattina
    - cron: "0 20 * * *"  # sera
  workflow_dispatch:

# se un aggiornamento è ancora in corso quando parte il successivo, il nuovo aspetta invece di sovrapporsi
concurrency:
  group: update-players
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Salva il conteggio attuale
        run: node -e 'const s=require("fs").readFileSync("js/data.js","utf8");console.log((s.match(/"q":"Q/g)||[]).length)' > old_count.txt

      - name: Scarica i giocatori da Wikidata
        run: node scripts/build-players.mjs --min-sitelinks 25 --since 1995

      # se Wikidata risponde male e i giocatori calano di colpo, non si pubblica nulla
      - name: Controlla che il dataset sia sano
        run: |
          OLD=$(cat old_count.txt)
          NEW=$(node -e 'const s=require("fs").readFileSync("js/data.js","utf8");console.log((s.match(/"q":"Q/g)||[]).length)')
          echo "Giocatori: prima $OLD, ora $NEW"
          if [ "$NEW" -lt $(( OLD * 9 / 10 )) ]; then echo "::error::Troppi giocatori in meno ($OLD → $NEW): aggiornamento annullato"; exit 1; fi
          rm old_count.txt

      - name: Commit se ci sono novità
        id: commit
        run: |
          # la prima riga del file contiene la data di generazione e cambia sempre: da sola non conta come novità,
          # altrimenti si farebbe un commit (e una ripubblicazione) due volte al giorno anche senza cambiamenti
          if git diff --quiet -I '^/\* GENERATO da scripts/build-players.mjs' js/data.js; then
            echo "Nessun cambiamento"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git commit -m "Aggiornamento giocatori ($(date -u +%Y-%m-%d) $( [ $(date -u +%H) -lt 12 ] && echo mattina || echo sera ))"
          # se nel frattempo è arrivato un altro commit su main, ci si mette sopra invece di fallire
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # un push fatto da un workflow non fa partire gli altri workflow, quindi la pubblicazione si richiama qui
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
