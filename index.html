<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <title>CareerKick</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="btnBack" class="icon-btn" aria-label="Menu" hidden>←</button>
      <div class="brand"><span class="ball">⚽</span> CareerKick</div>
      <div class="top-actions">
        <select id="langSelect" class="lang-select" aria-label="Language"></select>
        <button id="btnStats" class="icon-btn" aria-label="Stats">📊</button>
      </div>
    </header>

    <main>
      <!-- HOME -->
      <section id="screen-home" class="screen active">
        <p class="tagline" data-i18n="tagline"></p>

        <div class="card">
          <h2 data-i18n="setupTitle"></h2>

          <h3 data-i18n="difficulty"></h3>
          <div class="segmented" id="diffSeg">
            <button data-diff="easy" data-i18n="easy"></button>
            <button data-diff="medium" data-i18n="medium"></button>
            <button data-diff="hard" data-i18n="hard"></button>
          </div>
          <p class="hint" id="diffDesc"></p>

          <h3 data-i18n="leagues"></h3>
          <div class="segmented" id="lmSeg">
            <button data-lm="all" data-i18n="lmAll"></button>
            <button data-lm="single" data-i18n="lmSingle"></button>
            <button data-lm="multi" data-i18n="lmMulti"></button>
          </div>
          <p class="hint" id="lmDesc"></p>
          <div class="chips" id="leagueChips"></div>
          <p class="pool" id="poolInfo"></p>
        </div>

        <h2 class="section-title" data-i18n="modes"></h2>
        <div class="modes">
          <button class="mode-card" data-mode="classic">
            <span class="mode-icon">🎯</span>
            <span class="mode-text"><strong data-i18n="modeClassic"></strong><small data-i18n="modeClassicDesc"></small></span>
          </button>
          <button class="mode-card" data-mode="daily">
            <span class="mode-icon">📅</span>
            <span class="mode-text"><strong data-i18n="modeDaily"></strong><small data-i18n="modeDailyDesc"></small></span>
            <span class="badge" id="dailyBadge" hidden>✓</span>
          </button>
          <button class="mode-card" data-mode="survival">
            <span class="mode-icon">❤️</span>
            <span class="mode-text"><strong data-i18n="modeSurvival"></strong><small data-i18n="modeSurvivalDesc"></small></span>
          </button>
        </div>
      </section>

      <!-- GAME -->
      <section id="screen-game" class="screen">
        <div class="hud" id="hud"></div>
        <h2 class="section-title" data-i18n="career"></h2>
        <ol class="career" id="career"></ol>
        <div class="info" id="info"></div>
        <div class="wrongs" id="wrongs"></div>

        <div id="play">
          <div class="guess-box" id="guessBox">
            <div class="guess-row">
              <input id="guessInput" type="text" autocomplete="off" autocapitalize="words" spellcheck="false">
              <button id="btnGuess" class="btn primary" data-i18n="guess"></button>
            </div>
            <ul class="suggest" id="suggest"></ul>
          </div>
          <div class="game-actions">
            <button id="btnSkip" class="btn ghost" data-i18n="skip"></button>
            <button id="btnGiveUp" class="btn ghost danger" data-i18n="giveUp"></button>
          </div>
        </div>

        <div class="end-panel" id="endPanel" hidden></div>
      </section>
    </main>

    <!-- STATS -->
    <div class="sheet-backdrop" id="statsSheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true">
        <h2 data-i18n="stats"></h2>
        <div class="stats-grid" id="statsGrid"></div>
        <button class="btn primary block" id="btnCloseStats" data-i18n="close"></button>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
